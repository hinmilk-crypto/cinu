<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🦁 Leo's Fraction Adventure</title>
<style>
  :root{
    --sky:#7ad9ff;
    --grass:#7ee787;
    --sun:#ffd93d;
    --coral:#ff6b6b;
    --grape:#a78bfa;
    --tangerine:#ffa94d;
    --ink:#2b2540;
    --card-bg:#fffbe9;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family:'Baloo 2','Trebuchet MS','Comic Sans MS',sans-serif;
    color:var(--ink);
    overflow-x:hidden;
  }
  body{
    background:
      radial-gradient(circle at 15% 10%, #fff6bf 0%, transparent 40%),
      radial-gradient(circle at 85% 0%, #ffd6f0 0%, transparent 35%),
      linear-gradient(180deg,#8fe0ff 0%, #b6f2c1 55%, #fff4c9 100%);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:12px;
  }
  #app{
    width:100%;
    max-width:460px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    background:linear-gradient(135deg,#ffe28a,#ffb84d);
    border-radius:26px;
    padding:14px 16px;
    box-shadow:0 6px 0 #e08d1f, 0 10px 20px rgba(0,0,0,0.15);
    display:flex;
    align-items:center;
    justify-content:space-between;
    border:4px solid #fff;
  }
  .title{
    font-size:22px;
    font-weight:800;
    color:#7a3e00;
    text-shadow:1px 1px 0 #fff8;
    line-height:1.1;
  }
  .stat-pills{
    display:flex;
    gap:8px;
  }
  .pill{
    background:#fff;
    border-radius:20px;
    padding:6px 12px;
    font-weight:800;
    font-size:17px;
    display:flex;
    align-items:center;
    gap:4px;
    box-shadow:0 3px 0 rgba(0,0,0,0.15);
    white-space:nowrap;
  }
  .pill.coin{ color:#b8860b; }
  .pill.streak{ color:#d84315; }

  /* ---------- Level selector ---------- */
  .levels{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:4px 2px;
  }
  .level-btn{
    flex:1 0 auto;
    border:none;
    border-radius:18px;
    padding:10px 8px;
    font-size:13px;
    font-weight:800;
    background:#fff;
    color:#666;
    box-shadow:0 4px 0 rgba(0,0,0,0.12);
    cursor:pointer;
    text-align:center;
    line-height:1.3;
    transition:transform .12s;
  }
  .level-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,0.12); }
  .level-btn.active{
    background:linear-gradient(135deg,var(--grape),#7c5cff);
    color:#fff;
    transform:translateY(2px);
    box-shadow:0 2px 0 #5b3fd6;
  }

  /* ---------- Problem card ---------- */
  .problem-card{
    background:var(--card-bg);
    border-radius:28px;
    border:5px solid #fff;
    box-shadow:0 8px 0 #e8dfb0, 0 14px 24px rgba(0,0,0,0.15);
    padding:24px 16px 20px;
    position:relative;
    overflow:hidden;
  }
  .problem-type-tag{
    position:absolute;
    top:14px; left:14px;
    background:var(--coral);
    color:#fff;
    font-weight:800;
    font-size:13px;
    padding:5px 12px;
    border-radius:14px;
    box-shadow:0 3px 0 #c94848;
  }
  .timer-badge{
    position:absolute;
    top:14px; right:14px;
    background:var(--ink);
    color:#fff;
    font-weight:800;
    font-size:14px;
    padding:5px 12px;
    border-radius:14px;
    min-width:44px;
    text-align:center;
  }
  .timer-badge.low{ background:var(--coral); animation:pulse .5s infinite; }

  .fraction-display{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    font-size:42px;
    font-weight:800;
    margin:36px 0 30px;
    flex-wrap:wrap;
  }
  .frac{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    line-height:1.05;
  }
  .frac .num, .frac .den{
    min-width:1.2em;
    text-align:center;
  }
  .frac .bar{
    width:100%;
    height:5px;
    background:var(--ink);
    border-radius:3px;
    margin:4px 0;
  }
  .eq-sign{ font-size:38px; font-weight:800; }
  .blank{
    color:var(--grape);
    background:#f0e6ff;
    border:3px dashed var(--grape);
    border-radius:12px;
    padding:0 10px;
  }

  .answer-row{
    display:flex;
    gap:10px;
    margin-bottom:10px;
  }
  #answerInput{
    flex:1;
    font-size:30px;
    font-weight:800;
    text-align:center;
    border:4px solid var(--grape);
    border-radius:18px;
    padding:12px 8px;
    color:var(--ink);
    background:#fff;
    min-width:0;
  }
  #answerInput:focus{ outline:none; border-color:var(--coral); }
  #confirmBtn{
    background:linear-gradient(135deg,#7ee787,#3fbf5f);
    border:none;
    color:#fff;
    font-weight:800;
    font-size:20px;
    padding:0 26px;
    border-radius:18px;
    box-shadow:0 5px 0 #2c8f45;
    cursor:pointer;
  }
  #confirmBtn:active{ transform:translateY(4px); box-shadow:0 1px 0 #2c8f45; }

  .message{
    min-height:34px;
    text-align:center;
    font-size:18px;
    font-weight:800;
    border-radius:14px;
    padding:6px 8px;
    transition:all .2s;
  }
  .message.correct{ color:#1e7d32; background:#e3f7e6; }
  .message.wrong{ color:#c62828; background:#fdecec; }

  /* ---------- Bottom actions ---------- */
  .actions{
    display:flex;
    gap:10px;
  }
  .action-btn{
    flex:1;
    border:none;
    border-radius:20px;
    padding:16px 8px;
    font-size:15px;
    font-weight:800;
    color:#fff;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,0.2);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    position:relative;
  }
  .action-btn:active{ transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,0.2); }
  .action-btn:disabled{ opacity:0.5; cursor:not-allowed; transform:none; box-shadow:0 5px 0 rgba(0,0,0,0.2); }
  .btn-draw{ background:linear-gradient(135deg,var(--tangerine),#ff7b00); }
  .btn-dex{ background:linear-gradient(135deg,#74c0fc,#3b82f6); }
  .big-emoji{ font-size:26px; }

  /* ---------- Modal (card dex) ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(30,20,50,0.55);
    display:flex; align-items:center; justify-content:center;
    z-index:50;
    padding:16px;
  }
  .modal{
    background:#fffdf3;
    border-radius:26px;
    border:5px solid #fff;
    max-width:440px;
    width:100%;
    max-height:85vh;
    overflow-y:auto;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
  }
  .modal h2{ text-align:center; margin:0 0 6px; font-size:22px; }
  .modal .sub{ text-align:center; color:#777; font-weight:700; margin-bottom:14px; font-size:14px;}
  .card-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }
  .card-slot{
    aspect-ratio:1;
    border-radius:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-size:34px;
    background:#f1eee0;
    border:3px solid #ddd6b8;
  }
  .card-slot.owned{
    background:linear-gradient(150deg,#fff6cf,#ffe089);
    border-color:#f0c14b;
  }
  .card-slot .cname{ font-size:11px; font-weight:800; margin-top:2px; color:#5a4a1c;}
  .card-slot.locked{ color:#bbb; }
  .close-modal{
    display:block;
    margin:16px auto 0;
    background:var(--coral);
    color:#fff;
    border:none;
    border-radius:16px;
    padding:10px 26px;
    font-weight:800;
    font-size:15px;
    box-shadow:0 4px 0 #c94848;
  }
  .coupon-box{
    text-align:center;
    margin-top:14px;
    font-weight:800;
    background:#f3e9ff;
    color:#6a3fc9;
    border-radius:14px;
    padding:8px;
  }
  .reset-link{
    text-align:center;
    font-size:12px;
    color:#999;
    margin-top:14px;
    text-decoration:underline;
    cursor:pointer;
  }

  /* ---------- Animations ---------- */
  @keyframes pulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
  @keyframes floatUp{
    0%{ transform:translate(-50%,0) scale(1); opacity:1; }
    100%{ transform:translate(-50%,-90px) scale(1.4); opacity:0; }
  }
  .floatie{
    position:absolute;
    left:50%;
    top:40%;
    font-size:28px;
    pointer-events:none;
    animation:floatUp 1s ease-out forwards;
    z-index:10;
  }
  @keyframes sparklePop{
    0%{ transform:scale(0) rotate(0deg); opacity:1;}
    60%{ transform:scale(1.3) rotate(20deg); opacity:1;}
    100%{ transform:scale(0.4) rotate(40deg); opacity:0;}
  }
  .sparkle{
    position:absolute;
    font-size:22px;
    pointer-events:none;
    animation:sparklePop .7s ease-out forwards;
    z-index:11;
  }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-8px); }
    75%{ transform:translateX(8px); }
  }
  .shake{ animation:shake .3s; }
  @keyframes cardFlip{
    0%{ transform:rotateY(0deg) scale(0.6); }
    50%{ transform:rotateY(90deg) scale(1.1); }
    100%{ transform:rotateY(0deg) scale(1); }
  }
  .card-reveal{
    font-size:80px;
    text-align:center;
    animation:cardFlip .6s ease-out;
  }
  @keyframes confettiFall{
    0%{ transform:translateY(-20px) rotate(0deg); opacity:1;}
    100%{ transform:translateY(400px) rotate(360deg); opacity:0;}
  }
  .confetti{
    position:fixed;
    top:0;
    font-size:22px;
    pointer-events:none;
    animation:confettiFall 2s ease-in forwards;
    z-index:100;
  }
  @keyframes popIn{
    0%{ transform:scale(0.7); opacity:0;}
    100%{ transform:scale(1); opacity:1;}
  }
  .pop-modal{ animation:popIn .25s ease-out; }
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="title">🦁 Leo's<br>Fraction Adventure</div>
    <div class="stat-pills">
      <div class="pill coin">🪙 <span id="coinCount">0</span></div>
      <div class="pill streak">🔥 <span id="streakCount">0</span></div>
    </div>
  </div>

  <div class="levels" id="levelBar"></div>

  <div class="problem-card" id="problemCard">
    <div class="problem-type-tag" id="typeTag">통분</div>
    <div class="timer-badge" id="timerBadge" style="display:none;">15</div>
    <div class="fraction-display" id="fractionDisplay"></div>
    <div class="answer-row">
      <input id="answerInput" type="number" inputmode="numeric" placeholder="?" autocomplete="off">
      <button id="confirmBtn">확인!</button>
    </div>
    <div class="message" id="message"></div>
  </div>

  <div class="actions">
    <button class="action-btn btn-draw" id="drawBtn" disabled>
      <span class="big-emoji">🎁</span>
      <span>카드 뽑기 (코인 10개)</span>
    </button>
    <button class="action-btn btn-dex" id="dexBtn">
      <span class="big-emoji">📖</span>
      <span>동물 도감</span>
    </button>
  </div>

</div>

<script>
(function(){
  "use strict";

  // ---------------- Constants ----------------
  const ANIMALS = [
    {emoji:"🦁", name:"사자"},
    {emoji:"🐯", name:"호랑이"},
    {emoji:"🐼", name:"판다"},
    {emoji:"🐶", name:"강아지"},
    {emoji:"🐱", name:"고양이"},
    {emoji:"🐰", name:"토끼"},
    {emoji:"🐻", name:"곰"},
    {emoji:"🦊", name:"여우"},
    {emoji:"🐨", name:"코알라"},
    {emoji:"🐵", name:"원숭이"}
  ];

  const LEVELS = [
    {id:1, label:"🌱 새싹", cfg:{baseMin:2, baseMax:5, mults:[2,3,4,5]}},
    {id:2, label:"🌿 탐험가", cfg:{baseMin:2, baseMax:10, mults:[2,3,4,5,6]}},
    {id:3, label:"🌳 마스터", cfg:{baseMin:12, baseMax:30, mults:[2,3,4]}},
    {id:4, label:"🦁 챔피언", cfg:{baseMin:4, baseMax:15, mults:[6,7,8,9]}},
    {id:5, label:"👑 레전드", cfg:null}
  ];
  const TIME_LIMIT = 15;
  const STORAGE_KEY = "leo-fraction-save-v1";

  // ---------------- State ----------------
  let state = {
    coins: 0,
    streak: 0,
    bestStreak: 0,
    level: 1,
    cardsOwned: new Array(10).fill(false),
    wishCoupons: 0,
    totalCorrect: 0
  };

  let currentProblem = null;
  let timerInterval = null;
  let timeLeft = TIME_LIMIT;
  let audioCtx = null;

  // ---------------- Utilities ----------------
  function randInt(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function pick(arr){ return arr[randInt(0, arr.length-1)]; }
  function gcd(a,b){ return b===0 ? a : gcd(b, a%b); }
  function randCoprime(q){
    if(q<2) q=2;
    let p;
    let guard=0;
    do{
      p = randInt(1, q-1);
      guard++;
    } while(gcd(p,q)!==1 && guard<50);
    return p;
  }

  // ---------------- Storage ----------------
  async function loadState(){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        state = Object.assign(state, parsed);
        if(!Array.isArray(state.cardsOwned) || state.cardsOwned.length!==10){
          state.cardsOwned = new Array(10).fill(false);
        }
      }
    }catch(e){
      // no saved data yet, use defaults
    }
  }

  async function saveState(){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
    }catch(e){
      console.error("save failed", e);
    }
  }

  // ---------------- Audio ----------------
  function getCtx(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
    }
    return audioCtx;
  }
  function beep(freq, duration, delay, type, vol){
    const ctx = getCtx();
    if(!ctx) return;
    delay = delay||0;
    type = type||"sine";
    vol = vol===undefined ? 0.18 : vol;
    const start = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = vol;
    gain.gain.setValueAtTime(vol, start);
    gain.gain.exponentialRampToValueAtTime(0.001, start + duration/1000);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(start);
    osc.stop(start + duration/1000 + 0.02);
  }
  function soundCorrect(){ beep(523,120,0,"triangle"); beep(659,150,0.1,"triangle"); beep(784,180,0.22,"triangle"); }
  function soundWrong(){ beep(200,220,0,"sawtooth",0.15); }
  function soundCoin(){ beep(988,90,0,"square",0.12); beep(1318,110,0.08,"square",0.1); }
  function soundCardDraw(){ beep(440,100,0,"sine"); beep(554,100,0.1,"sine"); beep(659,100,0.2,"sine"); beep(880,220,0.3,"sine"); }
  function soundBonus(){ beep(660,90,0,"square",0.14); beep(880,90,0.09,"square",0.14); beep(1108,180,0.18,"square",0.14); }

  // ---------------- Problem generation ----------------
  function pickLevelCfg(level){
    if(level===5){
      const sub = LEVELS[randInt(0,3)];
      return sub.cfg;
    }
    return LEVELS[level-1].cfg;
  }

  function generateTongbun(cfg){
    const b = randInt(cfg.baseMin, cfg.baseMax);
    const a = randInt(1, Math.max(1,b-1));
    const m = pick(cfg.mults);
    const targetDenom = b*m;
    const targetNum = a*m;
    const blankIsNum = Math.random()<0.5;
    if(blankIsNum){
      return { type:"통분", topLeft:a, botLeft:b, topRight:null, botRight:targetDenom, blank:"topRight", answer:targetNum };
    }else{
      return { type:"통분", topLeft:a, botLeft:b, topRight:targetNum, botRight:null, blank:"botRight", answer:targetDenom };
    }
  }

  function generateYakbun(cfg){
    let q = randInt(cfg.baseMin, cfg.baseMax);
    if(q<2) q=2;
    const p = randCoprime(q);
    const m = pick(cfg.mults);
    const a = p*m;
    const b = q*m;
    const blankIsNum = Math.random()<0.5;
    if(blankIsNum){
      return { type:"약분", topLeft:a, botLeft:b, topRight:null, botRight:q, blank:"topRight", answer:p };
    }else{
      return { type:"약분", topLeft:a, botLeft:b, topRight:p, botRight:null, blank:"botRight", answer:q };
    }
  }

  function newProblem(){
    const cfg = pickLevelCfg(state.level);
    const type = Math.random()<0.5 ? "tongbun" : "yakbun";
    const problem = type==="tongbun" ? generateTongbun(cfg) : generateYakbun(cfg);
    currentProblem = problem;
    renderProblem();
    if(state.level===5){
      startTimer();
    }else{
      stopTimer();
      document.getElementById("timerBadge").style.display = "none";
    }
  }

  // ---------------- Timer (level 5) ----------------
  function startTimer(){
    stopTimer();
    timeLeft = TIME_LIMIT;
    const badge = document.getElementById("timerBadge");
    badge.style.display = "block";
    badge.textContent = timeLeft;
    badge.classList.remove("low");
    timerInterval = setInterval(()=>{
      timeLeft--;
      badge.textContent = timeLeft;
      if(timeLeft<=5) badge.classList.add("low");
      if(timeLeft<=0){
        stopTimer();
        handleTimeout();
      }
    }, 1000);
  }
  function stopTimer(){
    if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  }
  function handleTimeout(){
    showMessage("시간 초과! 정답은 " + currentProblem.answer + "예요 ⏰", false);
    state.streak = 0;
    updateStats();
    saveState();
    setTimeout(newProblem, 1200);
  }

  // ---------------- Rendering ----------------
  function fracHtml(top, bot, isBlank){
    const t = isBlank && top===null ? '<span class="blank">?</span>' : ('<span class="num">'+top+'</span>');
    const b = isBlank && bot===null ? '<span class="blank">?</span>' : ('<span class="den">'+bot+'</span>');
    return '<span class="frac">'+t+'<span class="bar"></span>'+b+'</span>';
  }

  function renderProblem(){
    document.getElementById("typeTag").textContent = currentProblem.type;
    const left = fracHtml(currentProblem.topLeft, currentProblem.botLeft, false);
    const right = fracHtml(
      currentProblem.blank==="topRight" ? null : currentProblem.topRight,
      currentProblem.blank==="botRight" ? null : currentProblem.botRight,
      true
    );
    document.getElementById("fractionDisplay").innerHTML =
      left + '<span class="eq-sign">=</span>' + right;
    const input = document.getElementById("answerInput");
    input.value = "";
    input.focus();
    document.getElementById("message").textContent = "";
    document.getElementById("message").className = "message";
  }

  function updateStats(){
    document.getElementById("coinCount").textContent = state.coins;
    document.getElementById("streakCount").textContent = state.streak;
    document.getElementById("drawBtn").disabled = state.coins < 10;
  }

  function showMessage(text, correct){
    const el = document.getElementById("message");
    el.textContent = text;
    el.className = "message " + (correct ? "correct" : "wrong");
  }

  function renderLevelBar(){
    const bar = document.getElementById("levelBar");
    bar.innerHTML = "";
    LEVELS.forEach(lv=>{
      const btn = document.createElement("button");
      btn.className = "level-btn" + (state.level===lv.id ? " active" : "");
      btn.innerHTML = lv.label;
      btn.onclick = ()=>{
        state.level = lv.id;
        renderLevelBar();
        saveState();
        newProblem();
      };
      bar.appendChild(btn);
    });
  }

  // ---------------- Effects ----------------
  function spawnFloatie(emoji, card){
    const el = document.createElement("div");
    el.className = "floatie";
    el.textContent = emoji;
    card.appendChild(el);
    setTimeout(()=>el.remove(), 1000);
  }
  function spawnSparkles(card){
    for(let i=0;i<6;i++){
      const el = document.createElement("div");
      el.className = "sparkle";
      el.textContent = "✨";
      el.style.left = (10 + Math.random()*80) + "%";
      el.style.top = (20 + Math.random()*50) + "%";
      el.style.animationDelay = (Math.random()*0.15)+"s";
      card.appendChild(el);
      setTimeout(()=>el.remove(), 800);
    }
  }
  function shakeCard(card){
    card.classList.remove("shake");
    void card.offsetWidth;
    card.classList.add("shake");
  }
  function confettiBurst(){
    const emojis = ["🎉","✨","🌟","🎊","🍀"];
    for(let i=0;i<24;i++){
      const el = document.createElement("div");
      el.className = "confetti";
      el.textContent = pick(emojis);
      el.style.left = Math.random()*100 + "vw";
      el.style.animationDelay = (Math.random()*0.6)+"s";
      el.style.fontSize = (16+Math.random()*16)+"px";
      document.body.appendChild(el);
      setTimeout(()=>el.remove(), 2200);
    }
  }

  // ---------------- Answer handling ----------------
  function submitAnswer(){
    const input = document.getElementById("answerInput");
    const val = parseInt(input.value, 10);
    const card = document.getElementById("problemCard");
    if(isNaN(val)){
      showMessage("숫자를 입력해봐요!", false);
      shakeCard(card);
      return;
    }
    if(val === currentProblem.answer){
      state.coins += 1;
      state.streak += 1;
      state.totalCorrect += 1;
      if(state.streak > state.bestStreak) state.bestStreak = state.streak;
      soundCorrect();
      spawnSparkles(card);
      spawnFloatie("🪙", card);

      let bonusMsg = "";
      if(state.streak>0 && state.streak % 5 === 0){
        state.coins += 3;
        bonusMsg = " 🔥 " + state.streak + "연속 보너스 +3코인!";
        setTimeout(soundBonus, 250);
      }
      showMessage("정답이에요! 잘했어요 🎉" + bonusMsg, true);
    }else{
      state.streak = 0;
      soundWrong();
      shakeCard(card);
      showMessage("아쉬워요! 정답은 " + currentProblem.answer + " 이에요", false);
    }
    updateStats();
    saveState();
    stopTimer();
    setTimeout(newProblem, 1100);
  }

  // ---------------- Card drawing ----------------
  function drawCard(){
    if(state.coins < 10) return;
    state.coins -= 10;
    soundCardDraw();
    updateStats();

    const idx = randInt(0,9);
    const alreadyOwned = state.cardsOwned[idx];
    state.cardsOwned[idx] = true;

    showCardRevealModal(idx, alreadyOwned);

    const allOwned = state.cardsOwned.every(Boolean);
    if(allOwned && state.wishCoupons===0){
      state.wishCoupons += 1;
      setTimeout(()=>{
        confettiBurst();
        alert("🎊 동물 카드 10종을 모두 모았어요!\n소원쿠폰 1개를 받았어요! 🪄");
      }, 700);
    }
    saveState();
  }

  function showCardRevealModal(idx, alreadyOwned){
    const animal = ANIMALS[idx];
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML =
      '<div class="modal pop-modal" style="text-align:center;">' +
        '<div class="card-reveal">'+animal.emoji+'</div>' +
        '<h2>'+animal.name+' 카드!</h2>' +
        '<div class="sub">'+(alreadyOwned ? "이미 가지고 있는 카드예요 (중복)" : "새로운 카드를 얻었어요! 도감에 저장했어요")+'</div>' +
        '<button class="close-modal">좋아요!</button>' +
      '</div>';
    document.body.appendChild(overlay);
    overlay.querySelector(".close-modal").onclick = ()=>overlay.remove();
    if(!alreadyOwned){
      setTimeout(()=>{
        const cardEmoji = overlay.querySelector(".card-reveal");
        for(let i=0;i<10;i++){
          const el = document.createElement("div");
          el.className = "sparkle";
          el.textContent = "✨";
          el.style.left = (20+Math.random()*60)+"%";
          el.style.top = (10+Math.random()*40)+"%";
          cardEmoji.parentElement.appendChild(el);
          setTimeout(()=>el.remove(), 800);
        }
      }, 100);
    }
  }

  // ---------------- Card Dex modal ----------------
  function showDex(){
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    const ownedCount = state.cardsOwned.filter(Boolean).length;
    let grid = "";
    ANIMALS.forEach((a, i)=>{
      const owned = state.cardsOwned[i];
      grid += '<div class="card-slot '+(owned?"owned":"locked")+'">' +
        '<div>'+(owned ? a.emoji : "❓")+'</div>' +
        '<div class="cname">'+(owned ? a.name : "???")+'</div>' +
      '</div>';
    });
    overlay.innerHTML =
      '<div class="modal pop-modal">' +
        '<h2>📖 동물 도감</h2>' +
        '<div class="sub">'+ownedCount+' / 10 마리 모았어요</div>' +
        '<div class="card-grid">'+grid+'</div>' +
        (state.wishCoupons>0 ? '<div class="coupon-box">🪄 소원쿠폰 '+state.wishCoupons+'개 보유중!</div>' : '') +
        '<button class="close-modal">닫기</button>' +
        '<div class="reset-link" id="resetLink">진행 상황 초기화</div>' +
      '</div>';
    document.body.appendChild(overlay);
    overlay.querySelector(".close-modal").onclick = ()=>overlay.remove();
    overlay.querySelector("#resetLink").onclick = ()=>{
      if(confirm("정말 모든 기록(코인, 카드, 레벨)을 초기화할까요?")){
        state = { coins:0, streak:0, bestStreak:0, level:1, cardsOwned:new Array(10).fill(false), wishCoupons:0, totalCorrect:0 };
        saveState();
        updateStats();
        renderLevelBar();
        overlay.remove();
        newProblem();
      }
    };
  }

  // ---------------- Init ----------------
  async function init(){
    await loadState();
    renderLevelBar();
    updateStats();
    newProblem();

    document.getElementById("confirmBtn").onclick = submitAnswer;
    document.getElementById("answerInput").addEventListener("keydown", (e)=>{
      if(e.key==="Enter") submitAnswer();
    });
    document.getElementById("drawBtn").onclick = drawCard;
    document.getElementById("dexBtn").onclick = showDex;
  }

  init();
})();
</script>
</body>
</html>
