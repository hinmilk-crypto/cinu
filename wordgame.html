<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>중1 영단어 게임</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#FF6FA5;
    --yellow:#FFC93C;
    --green:#3DDC97;
    --blue:#4EA8DE;
    --purple:#9B5DE5;
    --orange:#FF9142;
    --cream:#FFF7E6;
    --ink:#3A2E4D;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Gaegu','Jua',sans-serif;
    background:linear-gradient(160deg,#FFF7E6 0%,#FFEAF3 40%,#E8F6FF 100%);
    color:var(--ink);
    min-height:100vh;
  }
  .app{max-width:680px;margin:0 auto;padding:16px 16px 60px;}
  h1{
    font-family:'Jua',sans-serif;
    text-align:center;
    font-size:32px;
    margin:10px 0 16px;
    color:var(--purple);
    text-shadow:2px 2px 0 #fff, 3px 3px 0 rgba(155,93,229,0.25);
  }
  .nav{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-bottom:18px;
  }
  .nav button{
    font-family:'Jua',sans-serif;
    font-size:22px;
    padding:12px 24px;
    border:none;
    border-radius:20px;
    cursor:pointer;
    background:#fff;
    color:var(--purple);
    box-shadow:0 4px 0 #d8c4f5;
    transition:transform .1s;
  }
  .nav button.active{
    background:var(--purple);
    color:#fff;
    box-shadow:0 4px 0 #6b3aa8;
  }
  .nav button:active{transform:translateY(3px);box-shadow:none;}

  .panel{
    background:#fff;
    border-radius:28px;
    padding:22px;
    box-shadow:0 8px 0 rgba(0,0,0,0.06);
  }

  /* unit selector */
  .unitbox{
    background:var(--cream);
    border-radius:18px;
    padding:14px 14px 10px;
    margin-bottom:16px;
  }
  .unitbox-title{
    font-family:'Jua',sans-serif;
    font-size:18px;
    color:var(--purple);
    margin-bottom:8px;
  }
  .unitpills{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .pill{
    font-family:'Gaegu',sans-serif;
    font-weight:700;
    font-size:16px;
    padding:8px 14px;
    border-radius:16px;
    border:2px solid #ddd;
    background:#fff;
    color:#999;
    cursor:pointer;
  }
  .pill.on{
    background:var(--purple);
    color:#fff;
    border-color:var(--purple);
  }
  .pill.all{
    font-family:'Jua',sans-serif;
  }
  .pill.all.on{
    background:var(--orange);
    border-color:var(--orange);
  }

  /* status bar */
  .status{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:16px;
    font-size:22px;
    font-family:'Jua',sans-serif;
  }
  .coinbox, .couponbox{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--yellow);
    padding:8px 16px;
    border-radius:18px;
    color:#5a3d00;
  }
  .couponbox{background:var(--green); color:#08421f;}
  .dots{display:flex; gap:4px;}
  .dot{width:14px;height:14px;border-radius:50%;background:#eee;border:2px solid #d9b400;}
  .dot.filled{background:#d9b400;}

  .cardgrid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
    margin:14px 0 20px;
  }
  .cardslot{
    aspect-ratio:1/1;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    background:#f2f2f2;
    border:3px dashed #ccc;
  }
  .cardslot.got{
    background:linear-gradient(135deg,var(--pink),var(--orange));
    border:3px solid #fff;
    box-shadow:0 3px 0 rgba(0,0,0,0.15);
  }

  .redeem{
    display:block;
    width:100%;
    font-family:'Jua',sans-serif;
    font-size:22px;
    padding:14px;
    border:none;
    border-radius:18px;
    background:var(--orange);
    color:#fff;
    margin-bottom:18px;
    cursor:pointer;
    box-shadow:0 5px 0 #c9660f;
  }
  .redeem:active{transform:translateY(4px);box-shadow:none;}

  .question{
    font-size:26px;
    text-align:center;
    background:var(--cream);
    border-radius:20px;
    padding:22px 18px;
    margin-bottom:20px;
    line-height:1.7;
    min-height:110px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-weight:bold;
  }
  .qline{font-size:24px;}
  .qword{color:var(--blue); font-family:'Jua',sans-serif; font-size:38px; margin-top:10px;}
  .blank{color:var(--pink); font-weight:900;}
  .qspeaker{
    display:block;
    margin:12px auto 0;
    font-size:30px;
    background:#fff;
    border:3px solid var(--blue);
    border-radius:50%;
    width:56px;
    height:56px;
    cursor:pointer;
    box-shadow:0 4px 0 #cfe6f5;
  }
  .qspeaker:active{transform:translateY(3px); box-shadow:none;}

  .options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .opt{
    font-family:'Gaegu',sans-serif;
    font-weight:700;
    font-size:22px;
    padding:20px 10px;
    border:none;
    border-radius:20px;
    cursor:pointer;
    color:#fff;
    box-shadow:0 5px 0 rgba(0,0,0,0.15);
  }
  .opt:nth-child(1){background:var(--pink);}
  .opt:nth-child(2){background:var(--blue);}
  .opt:nth-child(3){background:var(--green);}
  .opt:nth-child(4){background:var(--purple);}
  .opt:active{transform:translateY(4px);box-shadow:none;}
  .opt:disabled{opacity:0.55; cursor:default;}
  .opt.correct{outline:5px solid #2ecc71;}
  .opt.wrong{outline:5px solid #e74c3c;}

  .feedback{
    text-align:center;
    font-size:24px;
    font-family:'Jua',sans-serif;
    margin:16px 0;
    min-height:34px;
  }
  .feedback.good{color:#2e9e5b;}
  .feedback.bad{color:#e0555a;}

  .nextbtn{
    display:block;
    margin:0 auto;
    font-family:'Jua',sans-serif;
    font-size:22px;
    padding:12px 30px;
    border:none;
    border-radius:18px;
    background:var(--blue);
    color:#fff;
    cursor:pointer;
    box-shadow:0 5px 0 #2f7fb0;
  }
  .nextbtn:active{transform:translateY(4px); box-shadow:none;}

  .noword{
    text-align:center;
    font-size:22px;
    color:#e0555a;
    padding:30px 10px;
    font-family:'Jua',sans-serif;
  }

  /* wordbook */
  .wb-title{
    font-family:'Jua',sans-serif;
    font-size:26px;
    color:var(--pink);
    text-align:center;
    margin-bottom:16px;
  }
  .wb-list{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:10px;}
  .wb-item{
    background:var(--cream);
    border-radius:16px;
    padding:14px 18px;
    font-size:22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    cursor:pointer;
    border:none;
    width:100%;
    text-align:left;
    font-family:'Gaegu',sans-serif;
  }
  .wb-item:active{transform:translateY(2px);}
  .wb-left{display:flex; align-items:center; gap:8px;}
  .wb-word{font-family:'Jua',sans-serif; color:var(--purple);}
  .wb-meaning{color:var(--ink);}
  .wb-speaker{font-size:22px;}
  .wb-empty{
    text-align:center;
    font-size:22px;
    color:#999;
    padding:40px 10px;
  }

  .overlay{
    position:fixed; inset:0;
    background:rgba(60,30,90,0.55);
    display:flex; align-items:center; justify-content:center;
    z-index:50;
  }
  .cardpop{
    background:#fff;
    border-radius:28px;
    padding:36px 30px;
    text-align:center;
    width:80%;
    max-width:320px;
    box-shadow:0 10px 0 rgba(0,0,0,0.2);
  }
  .cardpop .emoji{font-size:70px;}
  .cardpop h2{font-family:'Jua',sans-serif; color:var(--purple); font-size:26px; margin:10px 0;}
  .cardpop p{font-size:20px; margin:0 0 18px;}
  .cardpop button{
    font-family:'Jua',sans-serif;
    font-size:20px;
    padding:10px 28px;
    border:none;
    border-radius:16px;
    background:var(--pink);
    color:#fff;
    cursor:pointer;
    box-shadow:0 4px 0 #c94d7e;
  }
  .loading{text-align:center; font-size:22px; padding:60px 0; color:#999;}

  /* login screen */
  .loginbox{
    background:#fff;
    border-radius:28px;
    padding:36px 26px;
    text-align:center;
    box-shadow:0 8px 0 rgba(0,0,0,0.06);
  }
  .loginbox p{
    font-size:22px;
    margin:0 0 18px;
    color:var(--ink);
  }
  .loginbox input{
    font-family:'Gaegu',sans-serif;
    font-size:24px;
    padding:12px 16px;
    border-radius:16px;
    border:3px solid var(--purple);
    width:100%;
    max-width:280px;
    text-align:center;
    margin-bottom:16px;
    outline:none;
  }
  .loginbox button{
    font-family:'Jua',sans-serif;
    font-size:24px;
    padding:14px 36px;
    border:none;
    border-radius:20px;
    background:var(--purple);
    color:#fff;
    cursor:pointer;
    box-shadow:0 5px 0 #6b3aa8;
  }
  .loginbox button:active{transform:translateY(4px); box-shadow:none;}
  .loginmsg{
    color:#e0555a;
    font-size:16px;
    margin-top:6px;
    min-height:20px;
  }

  /* player bar */
  .playerbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
    font-size:18px;
  }
  .playerbar .who{
    font-family:'Jua',sans-serif;
    color:var(--purple);
  }
  .resetbtn{
    font-family:'Gaegu',sans-serif;
    font-weight:700;
    font-size:15px;
    padding:6px 14px;
    border-radius:14px;
    border:2px solid #e0555a;
    background:#fff;
    color:#e0555a;
    cursor:pointer;
  }
  .resetbtn:active{transform:translateY(2px);}
  .savewarn{
    background:#FFE1E1;
    color:#c0392b;
    border-radius:12px;
    padding:8px 12px;
    font-size:14px;
    text-align:center;
    margin-bottom:10px;
  }
</style>
</head>
<body>
<div class="app">
  <h1>🌈 중1 영단어 게임 🌈</h1>

  <div id="loginScreen">
    <div class="loginbox">
      <p>👋 이름을 쓰고 입장해주세요!<br>다음에 또 올 때 같은 이름으로 들어오면<br>쿠폰과 단어장이 그대로 남아있어요.</p>
      <input id="nameInput" type="text" placeholder="이름을 입력하세요" maxlength="10">
      <div class="loginmsg" id="loginMsg"></div>
      <div><button id="startBtn">시작하기 🚀</button></div>
    </div>
  </div>

  <div id="mainArea" style="display:none;">
    <div class="playerbar">
      <span class="who" id="whoLabel"></span>
      <button class="resetbtn" id="resetBtn">♻️ 초기화</button>
    </div>
    <div class="nav">
      <button id="navGame" class="active">🎮 게임</button>
      <button id="navBook">📒 내 단어장</button>
    </div>

    <div id="root">
      <div class="loading">불러오는 중... ⏳</div>
    </div>
  </div>
</div>

// 전체 단어를 unit 태그와 함께 펼친 배열
const ALL_WORDS = [];
UNITS.forEach(u=>{
  u.words.forEach(item=>{
    ALL_WORDS.push({unit:u.id, w:item.w, m:item.m, s:item.s});
  });
});

const CARD_EMOJIS = ["🐶","🐱","🐰","🐻","🐼","🦁","🐯","🐸","🐵","🐹"];
const CARD_NAMES = ["강아지","고양이","토끼","곰","판다","사자","호랑이","개구리","원숭이","햄스터"];

// ---------------- 상태 ----------------
let state = {
  coins: 0,
  cards: [],       // collected card indices (0-9)
  wishCoupons: 0
};
let wordbook = []; // [{w, m}]
let currentQuestion = null;
let lastWordKey = null;
let answered = false;
let selectedUnits = new Set(UNITS.map(u=>u.id)); // 기본: 전체 선택
let currentName = null;
let storageWarning = false;

const root = document.getElementById('root');
const navGame = document.getElementById('navGame');
const navBook = document.getElementById('navBook');
let currentView = 'game';

// ---------------- 이름(플레이어) 처리 ----------------
function sanitizeName(raw){
  return raw.trim().replace(/\s+/g,'_').replace(/["'\/\\]/g,'').slice(0,20);
}
function stateKey(){ return `game-state:${currentName}`; }
function wordbookKey(){ return `wordbook:${currentName}`; }

// window.storage가 아직 연결되기 전일 수 있으므로 잠시 기다렸다가 사용
function waitForStorage(timeout=4000){
  return new Promise((resolve)=>{
    const start = Date.now();
    (function check(){
      if(window.storage && typeof window.storage.get==='function'){ resolve(true); return; }
      if(Date.now()-start>timeout){ resolve(false); return; }
      setTimeout(check, 100);
    })();
  });
}

// ---------------- 저장/불러오기 ----------------
async function loadAll(){
  state = { coins:0, cards:[], wishCoupons:0 };
  wordbook = [];
  const ready = await waitForStorage();
  if(!ready){
    storageWarning = true;
    return;
  }
  storageWarning = false;
  try{
    const g = await window.storage.get(stateKey(), false);
    if(g && g.value){ state = JSON.parse(g.value); }
  }catch(e){ /* 없으면 기본값 사용 */ }
  try{
    const b = await window.storage.get(wordbookKey(), false);
    if(b && b.value){ wordbook = JSON.parse(b.value); }
  }catch(e){ /* 없으면 빈 배열 */ }
}

async function saveState(){
  const ready = await waitForStorage();
  if(!ready){ storageWarning = true; return; }
  try{ await window.storage.set(stateKey(), JSON.stringify(state), false); storageWarning=false; }
  catch(e){ console.error('상태 저장 실패', e); storageWarning = true; }
}
async function saveWordbook(){
  const ready = await waitForStorage();
  if(!ready){ storageWarning = true; return; }
  try{ await window.storage.set(wordbookKey(), JSON.stringify(wordbook), false); storageWarning=false; }
  catch(e){ console.error('단어장 저장 실패', e); storageWarning = true; }
}

async function resetAll(){
  state = { coins:0, cards:[], wishCoupons:0 };
  wordbook = [];
  const ready = await waitForStorage();
  if(ready){
    try{ await window.storage.delete(stateKey(), false); }catch(e){ /* 이미 없을 수 있음 */ }
    try{ await window.storage.delete(wordbookKey(), false); }catch(e){ /* 이미 없을 수 있음 */ }
  }
  currentQuestion = null;
  render();
}

// ---------------- 문제 생성 ----------------
function getPool(){
  return ALL_WORDS.filter(item=>selectedUnits.has(item.unit));
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function pickTarget(pool){
  let picked;
  if(pool.length===1){ return pool[0]; }
  do{
    picked = pool[Math.floor(Math.random()*pool.length)];
  }while(picked.w===lastWordKey);
  return picked;
}

function makeQuestion(){
  const pool = getPool();
  if(pool.length===0) return null;

  const target = pickTarget(pool);
  lastWordKey = target.w;
  const type = Math.random()<0.5 ? 'meaning' : 'fill';

  // 오답 보기는 전체 단어에서 뽑아 항상 4개를 채운다
  const distractPool = shuffle(ALL_WORDS.filter(item=>item.w!==target.w));
  const others = [];
  const usedVals = new Set();
  for(const item of distractPool){
    const val = type==='meaning' ? item.m : item.w;
    const targetVal = type==='meaning' ? target.m : target.w;
    if(val===targetVal || usedVals.has(val)) continue;
    usedVals.add(val);
    others.push(val);
    if(others.length===3) break;
  }

  if(type==='meaning'){
    const options = shuffle([target.m, ...others]);
    return {type, target, prompt:target.w, options, correct: target.m};
  }else{
    const options = shuffle([target.w, ...others]);
    return {type, target, prompt: target.s, options, correct: target.w};
  }
}

// ---------------- 렌더링: 단원 선택 ----------------
function renderUnitSelector(){
  const allOn = UNITS.every(u=>selectedUnits.has(u.id));
  const pills = UNITS.map(u=>`
    <button class="pill ${selectedUnits.has(u.id)?'on':''}" data-unit="${u.id}">${u.title.split('.')[0]}</button>
  `).join('');
  return `
    <div class="unitbox">
      <div class="unitbox-title">📚 공부할 단원을 골라보세요</div>
      <div class="unitpills">
        <button class="pill all ${allOn?'on':''}" data-unit="all">전체</button>
        ${pills}
      </div>
    </div>
  `;
}

function bindUnitSelector(){
  document.querySelectorAll('.pill').forEach(btn=>{
    btn.onclick = ()=>{
      const val = btn.dataset.unit;
      if(val==='all'){
        const allOn = UNITS.every(u=>selectedUnits.has(u.id));
        if(allOn){ selectedUnits = new Set(); }
        else{ selectedUnits = new Set(UNITS.map(u=>u.id)); }
      }else{
        const id = Number(val);
        if(selectedUnits.has(id)) selectedUnits.delete(id);
        else selectedUnits.add(id);
      }
      currentQuestion = null;
      renderGame();
    };
  });
}

// ---------------- 렌더링: 게임 ----------------
function renderGame(){
  const pool = getPool();
  const warnHtml = storageWarning ? `<div class="savewarn">⚠️ 저장 기능 연결이 늦어지고 있어요. 인터넷 상태를 확인하거나 잠시 후 다시 시도해주세요. (지금은 진행 상황이 저장되지 않을 수 있어요)</div>` : '';

  if(pool.length===0){
    root.innerHTML = `
      <div class="panel">
        ${warnHtml}
        ${renderUnitSelector()}
        <div class="noword">공부할 단원을 1개 이상 골라주세요! 🙏</div>
      </div>
    `;
    bindUnitSelector();
    return;
  }

  if(!currentQuestion){
    currentQuestion = makeQuestion();
    answered = false;
  }
  const q = currentQuestion;

  const filledDots = Array.from({length:10}, (_,i)=>`<div class="dot ${i<state.coins?'filled':''}"></div>`).join('');
  const cardSlots = Array.from({length:10}, (_,i)=>{
    const got = state.cards.includes(i);
    return `<div class="cardslot ${got?'got':''}">${got?CARD_EMOJIS[i]:'❓'}</div>`;
  }).join('');

  let promptHtml;
  if(q.type==='meaning'){
    promptHtml = `<div class="qline">이 단어의 뜻은<br>무엇일까요?</div><div class="qword">${q.target.w}</div><button class="qspeaker" id="qSpeakerBtn">🔊</button>`;
  }else{
    const parts = q.prompt.split('___');
    promptHtml = `<div class="qline">빈칸에 알맞은 단어를<br>고르세요</div><div class="qword" style="font-size:24px;">${parts[0]}<span class="blank">____</span>${parts[1]||''}</div><button class="qspeaker" id="qSpeakerBtn">🔊</button>`;
  }

  const optionsHtml = q.options.map(opt=>{
    return `<button class="opt" data-val="${encodeURIComponent(opt)}">${opt}</button>`;
  }).join('');

  const redeemBtn = state.cards.length>=10
    ? `<button class="redeem" id="redeemBtn">🎁 카드 10장 모두 모았어요! 소원 쿠폰으로 바꾸기</button>`
    : '';

  root.innerHTML = `
    <div class="panel">
      ${warnHtml}
      ${renderUnitSelector()}
      <div class="status">
        <div class="coinbox">🪙 ${state.coins} / 10 <div class="dots">${filledDots}</div></div>
        <div class="couponbox">🎟️ 소원 쿠폰 ${state.wishCoupons}개</div>
      </div>
      <div class="cardgrid">${cardSlots}</div>
      ${redeemBtn}
      <div class="question">${promptHtml}</div>
      <div class="options">${optionsHtml}</div>
      <div class="feedback" id="feedback"></div>
      <div id="nextArea"></div>
    </div>
  `;

  bindUnitSelector();

  const speakerBtn = document.getElementById('qSpeakerBtn');
  if(speakerBtn){
    speakerBtn.onclick = ()=>speakQuestion();
  }
  speakQuestion();

  if(redeemBtn){
    document.getElementById('redeemBtn').onclick = ()=>{
      state.cards = [];
      state.wishCoupons += 1;
      saveState();
      renderGame();
    };
  }

  document.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick = ()=>handleAnswer(decodeURIComponent(btn.dataset.val));
  });
}

function handleAnswer(chosen){
  if(answered) return;
  answered = true;
  const q = currentQuestion;
  const correct = chosen === q.correct;

  document.querySelectorAll('.opt').forEach(btn=>{
    const val = decodeURIComponent(btn.dataset.val);
    btn.disabled = true;
    if(val===q.correct) btn.classList.add('correct');
    else if(val===chosen) btn.classList.add('wrong');
  });

  const fb = document.getElementById('feedback');

  if(correct){
    fb.textContent = '정답이에요! 코인 1개 획득! 🪙';
    fb.className = 'feedback good';
    state.coins += 1;
  }else{
    fb.innerHTML = `아쉬워요! 정답은 <b>${q.correct}</b> 이에요. 단어장에 저장할게요 📒`;
    fb.className = 'feedback bad';
    const exists = wordbook.some(item=>item.w===q.target.w);
    if(!exists){
      wordbook.push({w:q.target.w, m:q.target.m});
      saveWordbook();
    }
  }

  let cardDrawn = null;
  if(state.coins>=10){
    state.coins = 0;
    const cid = Math.floor(Math.random()*10);
    const isNew = !state.cards.includes(cid);
    if(isNew) state.cards.push(cid);
    cardDrawn = {cid, isNew};
  }
  saveState();

  const nextArea = document.getElementById('nextArea');
  nextArea.innerHTML = `<button class="nextbtn" id="nextBtn" style="margin-top:14px;">다음 문제 ➡️</button>`;
  document.getElementById('nextBtn').onclick = ()=>{
    currentQuestion = null;
    renderGame();
  };

  if(cardDrawn){
    showCardPopup(cardDrawn);
  }
}

function showCardPopup({cid, isNew}){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="cardpop">
      <div class="emoji">${CARD_EMOJIS[cid]}</div>
      <h2>${isNew ? '새로운 카드 획득!' : '카드를 또 뽑았어요!'}</h2>
      <p>${CARD_NAMES[cid]} 카드 ${isNew ? '' : '(이미 있는 카드예요)'}</p>
      <button id="closePopup">좋아요!</button>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('closePopup').onclick = ()=>overlay.remove();
}

// ---------------- 렌더링: 단어장 ----------------
function renderBook(){
  let listHtml;
  if(wordbook.length===0){
    listHtml = `<div class="wb-empty">아직 틀린 단어가 없어요! 😊<br>게임을 하면 여기에 쌓여요.</div>`;
  }else{
    listHtml = `<ul class="wb-list">` + wordbook.map((item,i)=>`
      <li>
        <button class="wb-item" data-idx="${i}">
          <span class="wb-left">
            <span class="wb-speaker">🔊</span>
            <span class="wb-word">${item.w}</span>
          </span>
          <span class="wb-meaning">${item.m}</span>
        </button>
      </li>
    `).join('') + `</ul>`;
  }
  root.innerHTML = `
    <div class="panel">
      ${storageWarning ? `<div class="savewarn">⚠️ 저장 기능 연결이 늦어지고 있어요. 잠시 후 다시 시도해주세요.</div>` : ''}
      <div class="wb-title">📒 내 단어장 (틀린 단어 ${wordbook.length}개)</div>
      <div style="text-align:center; font-size:16px; color:#aaa; margin-bottom:14px;">단어를 누르면 발음을 들을 수 있어요 🔊</div>
      ${listHtml}
    </div>
  `;

  document.querySelectorAll('.wb-item').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = Number(btn.dataset.idx);
      speakWord(wordbook[idx].w);
    };
  });
}

function speakQuestion(){
  const q = currentQuestion;
  if(!q) return;
  if(q.type==='meaning'){
    speakWord(q.target.w);
  }else{
    const sentence = q.prompt.replace('___', '...');
    speakWord(sentence);
  }
}

function speakWord(text){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    utter.rate = 0.85;
    window.speechSynthesis.speak(utter);
  }catch(e){
    console.error('발음 재생 실패', e);
  }
}

function render(){
  if(currentView==='game') renderGame();
  else renderBook();
}

navGame.onclick = ()=>{
  currentView='game';
  navGame.classList.add('active');
  navBook.classList.remove('active');
  render();
};
navBook.onclick = ()=>{
  currentView='book';
  navBook.classList.add('active');
  navGame.classList.remove('active');
  render();
};

document.getElementById('resetBtn').onclick = async ()=>{
  const ok = window.confirm('정말 초기화 할까요?\n모아둔 코인, 카드, 소원 쿠폰, 내 단어장이 모두 사라져요!');
  if(!ok) return;
  await resetAll();
};

// ---------------- 로그인/시작 ----------------
const loginScreen = document.getElementById('loginScreen');
const mainArea = document.getElementById('mainArea');
const nameInput = document.getElementById('nameInput');
const loginMsg = document.getElementById('loginMsg');
const startBtn = document.getElementById('startBtn');
const whoLabel = document.getElementById('whoLabel');

async function startGame(){
  const raw = nameInput.value;
  const clean = sanitizeName(raw);
  if(!clean){
    loginMsg.textContent = '이름을 입력해주세요!';
    return;
  }
  currentName = clean;
  loginScreen.style.display = 'none';
  mainArea.style.display = 'block';
  whoLabel.textContent = `👤 ${clean}님`;
  root.innerHTML = '<div class="loading">불러오는 중... ⏳</div>';
  await loadAll();
  currentView = 'game';
  render();
}

startBtn.onclick = startGame;
nameInput.addEventListener('keydown', (e)=>{
  if(e.key==='Enter') startGame();
});
